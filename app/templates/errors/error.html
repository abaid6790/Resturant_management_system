<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"><title>{{ status }}</title></head>
<body><div class="center-card">
  <div class="code">{{ status }}</div>
  <h1 style="font-size:1.3rem">{{ {403:'You do not have access', 404:'Page not found', 400:'That request could not be processed', 429:'Too many requests', 500:'Something went wrong'}.get(status, 'Request failed') }}</h1>
  <p class="muted">{{ message }}</p>
  <p><a class="btn" href="/">Back to home</a></p>
</div></body></html>
